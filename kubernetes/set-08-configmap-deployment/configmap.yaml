apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: configmap-demo
data:
  APP_ENV: "production"
  DATABASE_HOST: "db.internal.local"
  APP_MESSAGE: "ConfigMap Injected Successfully via Jenkins Pipeline!"
  app-settings.json: |
    {
      "logLevel": "debug",
      "timeout": 3000,
      "features": {
        "betaUI": true,
        "metricsEnabled": true
      }
    }
