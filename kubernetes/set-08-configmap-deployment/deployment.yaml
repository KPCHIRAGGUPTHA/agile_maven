apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-demo-deployment
  labels:
    app: configmap-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: configmap-demo
  template:
    metadata:
      labels:
        app: configmap-demo
    spec:
      containers:
        - name: app-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          # Injected as environment variables
          envFrom:
            - configMapRef:
                name: app-config
          # Injected as a mounted volume file
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: app-config
