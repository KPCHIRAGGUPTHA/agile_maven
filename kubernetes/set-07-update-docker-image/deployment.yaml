apiVersion: apps/v1
kind: Deployment
metadata:
  name: update-demo-deployment
  labels:
    app: update-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: update-demo
  template:
    metadata:
      labels:
        app: update-demo
    spec:
      containers:
        - name: app-container
          image: nginx:1.24-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
