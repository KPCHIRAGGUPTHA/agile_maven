apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-docker-deployment
  labels:
    app: cicd-docker-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-docker-app
  template:
    metadata:
      labels:
        app: cicd-docker-app
    spec:
      containers:
        - name: web-app
          image: kpchiragguptha/devops-k8s-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "cicd-production"
            - name: APP_MESSAGE
              value: "Built by Jenkins Docker CI/CD Pipeline"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
