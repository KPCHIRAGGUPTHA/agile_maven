apiVersion: apps/v1
kind: Deployment
metadata:
  name: troubleshoot-demo-deployment
  labels:
    app: troubleshoot-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: troubleshoot-demo
  template:
    metadata:
      labels:
        app: troubleshoot-demo
    spec:
      containers:
        - name: app-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
