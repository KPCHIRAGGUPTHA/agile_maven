apiVersion: v1
kind: Pod
metadata:
  name: pvc-demo-pod
  labels:
    app: pvc-demo
spec:
  containers:
    - name: storage-container
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: persistent-storage
          mountPath: /data
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: app-storage-pvc
